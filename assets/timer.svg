<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128">
  <title>Shutdown timer — glossy power button</title>
  <defs>
    <linearGradient id="face" x1="4.6" y1="4.6" x2="19.4" y2="19.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63E3C6"/>
      <stop offset="0.5" stop-color="#2E9BD8"/>
      <stop offset="1" stop-color="#23439F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="7.4" cy="6.2" r="10.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="8" cy="6.4" r="2.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- drop shadow -->
  <circle cx="12" cy="12.9" r="8.4" fill="#12224a" opacity="0.45"/>
  <!-- face -->
  <circle cx="12" cy="12" r="8.4" fill="url(#face)"/>
  <!-- glass sheen from the top-left -->
  <circle cx="12" cy="12" r="8.4" fill="url(#sheen)"/>
  <!-- specular pip -->
  <circle cx="8" cy="6.4" r="2.4" fill="url(#spec)"/>
  <!-- inner shade along the bottom edge (convex) -->
  <path d="M18.34 14.96 A 7 7 0 0 1 5.66 14.96" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>
  <!-- dark rim -->
  <circle cx="12" cy="12" r="8.4" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="0.7"/>
  <!-- white power glyph -->
  <g fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round">
    <path d="M14.25 8.5 A 4.5 4.5 0 1 1 7.5 12.4"/>
    <path d="M12 5.8 V 9.8"/>
  </g>
</svg>
